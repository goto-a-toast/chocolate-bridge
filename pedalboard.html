<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedalboard</title>
<style>
  :root {
    --bg: #111214; --panel: #1b1d21; --edge: #2c2f35; --ink: #f2f2f0; --quiet: #8b8f97;
    --on: #3ee07a; --on-glow: rgba(62, 224, 122, .45); --off: #3a3d44; --warn: #f0b429;
    --rec: #ff4d4d; --dub: #ff9f1c; --play: #3ee07a; --stop: #6b7079;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 24px 32px; gap: 22px; min-height: 100vh; }
  header { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  #num { font-size: clamp(48px, 10vw, 120px); font-weight: 800; line-height: 1; color: var(--quiet); }
  #preset { font-size: clamp(32px, 6vw, 80px); font-weight: 700; line-height: 1.1; }
  #meta { margin-left: auto; color: var(--quiet); font-size: 14px; text-align: right; line-height: 1.6; }

  /* loopers */
  #loopers { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .loop { --c: var(--stop); background: var(--panel); border: 2px solid var(--c); border-radius: 16px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .loop.stop, .loop.unknown { border-color: var(--edge); }
  .lp-head { display: flex; align-items: baseline; gap: 10px; }
  .lp-num { font-size: 22px; font-weight: 800; color: var(--quiet); }
  .lp-name { font-size: 15px; color: var(--quiet); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lp-state { font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; color: var(--c); letter-spacing: .03em; }
  .loop.record .lp-state, .loop.overdub .lp-state { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .bar { position: relative; height: 12px; border-radius: 6px; background: var(--off); overflow: hidden; }
  .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--c); border-radius: 6px; }
  .head { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--ink); border-radius: 2px; display: none; }
  .lp-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--quiet); }
  .chip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--edge); font-weight: 700; }
  .chip.lit { border-color: var(--ink); color: var(--ink); }
  .lp-len { margin-left: auto; }
  .lp-next { font-size: 14px; color: var(--quiet); }
  .lp-next b { color: var(--ink); }
  .lp-warn { color: var(--warn); font-size: 13px; }
  #loopNote { color: var(--quiet); font-size: 13px; text-align: right; margin-top: -12px; }

  /* pedals */
  #mode { display: none; color: var(--dub); font-weight: 700; font-size: 18px; }
  #mode.show { display: block; }
  #board { flex: 1; display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); align-content: center; }
  .pedal { --c: var(--on); background: var(--panel); border: 2px solid var(--edge); border-radius: 18px;
    padding: 22px 18px 26px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    transition: border-color .12s, box-shadow .12s; min-height: 220px; }
  .pedal.on { border-color: var(--c); box-shadow: 0 0 28px color-mix(in srgb, var(--c) 45%, transparent); }
  .led { width: 34px; height: 34px; border-radius: 50%; background: var(--off); transition: background .12s, box-shadow .12s; }
  .pedal.on .led { background: var(--c); box-shadow: 0 0 22px var(--c); }
  .name { font-size: clamp(20px, 2.6vw, 32px); font-weight: 700; text-align: center; word-break: break-word; }
  .state { font-size: 15px; font-weight: 700; letter-spacing: .08em; color: var(--quiet); text-align: center; }
  .pedal.on .state { color: var(--c); }
  .switch { margin-top: auto; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--edge);
    display: grid; place-items: center; font-size: 22px; font-weight: 800; color: var(--quiet); }
  .switch.none { visibility: hidden; }
  footer { display: flex; gap: 10px; flex-wrap: wrap; }
  .chain { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--edge); color: var(--quiet); font-size: 15px; }
  .chain.active { border-color: var(--ink); color: var(--ink); font-weight: 700; }
  #msg { display: none; position: fixed; inset: 0; background: rgba(17, 18, 20, .92);
    align-items: center; justify-content: center; text-align: center; padding: 32px;
    font-size: clamp(20px, 3vw, 30px); line-height: 1.6; color: var(--warn); }
  #msg.show { display: flex; }
  @media (max-width: 600px) {
    body { padding: 16px; } #board { grid-template-columns: repeat(2, 1fr); gap: 12px; } .pedal { min-height: 170px; }
    #loopers { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div id="num">–</div>
  <div id="preset">…</div>
  <div id="meta"></div>
</header>

<section id="loopers"></section>
<div id="loopNote"></div>

<div id="mode"></div>
<main id="board"></main>
<footer id="chains"></footer>
<div id="msg" class="show">接続中…</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MAIN_GROUP = 8, CLEAR_GROUP = 7, SWITCHES = 'ABCD';

// What one more press of a Looper's main button does with Live's default settings
// (record -> overdub? confirm on the real Looper).
const LOOK = {
  record:  { label: '● REC',     color: 'var(--rec)',  text: '録音中' },
  overdub: { label: '● OVERDUB', color: 'var(--dub)',  text: '重ね録り中' },
  play:    { label: '▶ PLAY',    color: 'var(--play)', text: '再生中' },
  stop:    { label: '■ STOP',    color: 'var(--stop)', text: '停止中' },
  unknown: { label: '? —',       color: 'var(--stop)', text: '状態不明' },
};
const look = st => LOOK[st] || LOOK.unknown;
function nextAction(state, hasLoop) {
  if (state === 'record') return '重ね録り';
  if (state === 'overdub') return '再生';
  if (state === 'play') return '重ね録り';
  if (state === 'stop') return hasLoop ? '再生' : '録音開始';
  return '—';
}

let loops = [], loopsAt = 0;

function renderLoopers(list) {
  loops = list || []; loopsAt = performance.now();
  $('loopers').innerHTML = loops.map((lp, n) => {
    const L = look(lp.state), hasLoop = !!(lp.clock && lp.clock.length);
    const sw = SWITCHES[n];
    return `
      <div class="loop ${lp.state}" style="--c:${L.color}">
        <div class="lp-head"><span class="lp-num">LOOP ${lp.number}</span><span class="lp-name">${esc(lp.name)}</span></div>
        <div class="lp-state">${L.label}</div>
        <div class="bar"><div class="fill" id="fill${n}"></div><div class="head" id="head${n}"></div></div>
        <div class="lp-row">
          <span class="chip ${lp.reverse ? 'lit' : ''}">◀ REV</span>
          <span class="chip ${Math.abs((lp.factor ?? 1) - 1) > 0.01 ? 'lit' : ''}">SPEED ${esc(lp.speed ?? '—')}</span>
          <span class="lp-len" id="len${n}"></span>
        </div>
        <div class="lp-next">グループ8の ${sw} で：<b>${esc(nextAction(lp.state, hasLoop))}</b>${lp.state === 'play' || lp.state === 'overdub' ? '（2回で停止）' : ''}</div>
        ${lp.where === 'chain' ? '<div class="lp-warn">Pedalboard ラックの中にあります。プリセットを切り替えると止まるので、専用のトラックに移してください。</div>' : ''}
      </div>`;
  }).join('');
  $('loopNote').textContent = loops.length ? 'ループの位置と長さは目安です' : '';
}

function tick() {
  const dt = (performance.now() - loopsAt) / 1000;
  loops.forEach((lp, n) => {
    const fill = $('fill' + n), head = $('head' + n), len = $('len' + n), c = lp.clock;
    if (!fill || !c) return;
    if (lp.state === 'record' && c.recording != null) {
      const sec = c.recording + dt;
      fill.style.width = Math.min(100, (sec % 8) / 8 * 100) + '%';
      head.style.display = 'none';
      len.textContent = `録音 ${sec.toFixed(1)} 秒`;
    } else if (c.length) {
      let p = c.phase + dt * c.rate / c.length;
      p = ((p % 1) + 1) % 1;
      fill.style.width = (p * 100) + '%';
      head.style.display = 'block'; head.style.left = `calc(${p * 100}% - 1.5px)`;
      len.textContent = `約 ${c.length.toFixed(1)} 秒`;
    } else {
      fill.style.width = '0'; head.style.display = 'none';
      len.textContent = lp.state === 'stop' ? '' : '長さ不明';
    }
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function pedal({ name, state, switchKey, on, color }) {
  return `
    <div class="pedal ${on ? 'on' : ''}" ${color ? `style="--c:${color}"` : ''}>
      <div class="led"></div>
      <div class="name">${esc(name)}</div>
      <div class="state">${esc(state)}</div>
      <div class="switch ${switchKey ? '' : 'none'}">${esc(switchKey || '')}</div>
    </div>`;
}

function looperPedals(list, clearMode) {
  return SWITCHES.split('').map((sw, n) => {
    const lp = list[n];
    if (!lp) return pedal({ name: `Loop ${n + 1}`, switchKey: sw, state: 'Looper がありません' });
    const L = look(lp.state), active = lp.state !== 'stop' && lp.state !== 'unknown';
    const hasLoop = !!(lp.clock && lp.clock.length);
    return clearMode
      ? pedal({ name: `Loop ${n + 1} 消去`, switchKey: sw, on: hasLoop, color: L.color,
                state: hasLoop ? `${L.text} → 消去` : 'ループなし' })
      : pedal({ name: `Loop ${n + 1}`, switchKey: sw, on: active, color: L.color,
                state: `${L.text} → ${nextAction(lp.state, hasLoop)}` });
  }).join('');
}

function render(s) {
  const msg = $('msg');
  if (!s.live) {
    msg.innerHTML = 'Live に接続されていません<br><small>Live を起動し、コントロールサーフェスで ChocolatePedalboard を選んでください</small>';
    msg.classList.add('show'); return;
  }
  if (!s.rack) {
    msg.innerHTML = '「Pedalboard」という名前のラックが見つかりません<br><small>Audio Effect Rack の名前を Pedalboard にしてください</small>';
    msg.classList.add('show'); return;
  }
  msg.classList.remove('show');

  const i = s.active;
  $('num').textContent = i == null ? '–' : i + 1;
  $('preset').textContent = i == null ? '（チェーンなし）' : s.chains[i];
  $('meta').innerHTML = `グループ ${esc(s.group)}<br>${esc(s.track)}`;
  renderLoopers(s.loopers);

  const mode = $('mode');
  if (s.group === MAIN_GROUP || s.group === CLEAR_GROUP) {
    const clearMode = s.group === CLEAR_GROUP;
    mode.textContent = clearMode ? 'ルーパー消去（グループ 7）' : 'ルーパー録音・再生（グループ 8）／2回踏みで停止';
    mode.classList.add('show');
    $('board').innerHTML = looperPedals(s.loopers || [], clearMode);
  } else {
    mode.classList.remove('show');
    $('board').innerHTML = s.pedals.map(p =>
      pedal({ name: p.name, switchKey: p.switch, on: p.on, state: p.on ? 'ON' : 'OFF' })).join('');
  }
  $('chains').innerHTML = s.chains.map((c, n) =>
    `<div class="chain ${n === i ? 'active' : ''}">${n + 1} ${esc(c)}</div>`).join('');
}

function connect() {
  const es = new EventSource('/events');
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => {
    $('msg').innerHTML = 'ブリッジに接続できません<br><small>再接続を試みています…</small>';
    $('msg').classList.add('show');
  };  // EventSource reconnects by itself
}
connect();
</script>
</body>
</html>
